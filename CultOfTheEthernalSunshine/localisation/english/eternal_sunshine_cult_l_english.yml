l_english:
  origin_eternal_sunshine_cult:0 "Cult of the Eternal Sunshine"
  origin_eternal_sunshine_cult_desc:0 "This society reached stability through faith and devotion, guided by the radiant teachings of the Eternal Sunshine. Every citizen knows their place within the sacred order, and every triumph is offered in devotion to the light that promises salvation. The Cult's demands shape the destiny of the empire, rewarding unwavering faith with miraculous relics and divine favor. Yet should devotion falter, doubt may spread through the shadows, and heresy will threaten to extinguish the light from within."

  ########################################
  # MODIFIERS
  ########################################

  es_government_ethic_attraction:0 "Sets pops' government ethics attraction to 60%"
  cult_disappointment_modifier:0 "Cult Disappointment"

  cult_disappointment_modifier_desc:0 "The cult is deeply saddened by our failure to satisfy their demands, creating unrest across our worlds."
  cult_disappointment_modifier.tooltip:0 "The Cult will gain the §Y$cult_disappointment_modifier$§! modifier for 2 years."

  es_show_of_strenght:0 "Increase ships fire rate and hull by 10%"

  es_lack_of_energy:0 "Increase Happiness by 10% but reduces Energy production by 10%"

  es_research_symposium:0 "Increase research speed by 10%"

  es_fleet_pilgrimage:0 "Increase naval experience gain by 10%"

  es_festival_of_unity:0 "Increase stability and happiness by 5% on all owned planets"

  es_civic_education_program:0 "Increase all Pop happiness by 10%"

  es_administrative_reform:0 "Increase Unity production by 10%"

  es_colonization_initiative:0 "Increase colony development speed by 25%"

  es_hall_of_heroes:0 "Increase Unity production by 15% but reduces energy production by 5%"

  es_trade_fair:0 "Increase Trade Value by 10%"

  es_planetary_beautification:0 "Increase Amenities on all planets by 10%"

  es_strategic_defensive_investment:0 "Increase ships' Hull and Shields by 10% each"

  es_emergency_authority:0 "Increase stability by 20%, reduce happiness by 10%"

  es_civil_authorities:0 "Increase crime by 20%"

  es_destroy_stele:0 "Increase stability and devastation by 10%"

  es_recruitment_campaign:0 "Increase happiness by 10%"

  cult_satisfied_modifier:0 "Permanently increase happiness by 10%"

  ########################################
  # FACTION EVENTS
  ########################################
  factions.2.title:0 "A New Age Has Begun"
  factions.2.desc:0 "From the highest spheres of [Root.Owner.GetName] society, a group of hooded erudites has assembled in a faction to represent the people's needs in this age of cosmic consciousness. They call themselves the §HCult of the Eternal Sunshine§!, and they have declared that their purpose is to make sure that all of the population is aligned with our ethics. Their leader declared: "As long as we remain on the same side, the side of Order and Stability, we'll fight along for the good of [Root.Owner.GetName]. Betray us, and prepare to face the consequences."\n\nThey seem to have the support of the vast majority of the population."
  factions.2.a:0 "May the Light guide us."

  ########################################
  # REQUESTS
  ########################################
  es_req.101.title:0 "Celebrative feast"
  es_req.101.desc:0 "We have received a request from the §HCult of the Eternal Sunshine§!:\n"In order to commemorate the anniversary of the establishment of order and progress thanks to the guidance of our Cult, we demand a great feast worthy of a prosperous universe.""
  es_req.101.a:0 "Let them access the food supplies."
  es_req.101.b:0 "We won't waste food resources in parties"

  es_req.102.title:0 "Public Donations"
  es_req.102.desc:0 "We have received a request from the §HCult of the Eternal Sunshine§!:\n"In recognition of our shared prosperity, the faithful call upon the Empire to extend its generosity to those in need. A coordinated act of redistribution will strengthen the bonds between citizens and state.""
  es_req.102.a:0 "Allocate emergency funds."
  es_req.102.b:0 "The treasury cannot support this expense."

  es_req.103.title:0 "Cultural Sponsorship"
  es_req.103.desc:0 "We have received a request from the §HCult of the Eternal Sunshine§!:\n"The Cult requests the allocation of resources toward cultural enrichment initiatives. Art, expression, and celebration of unity shall reinforce the guiding ideals of our civilization.""
  es_req.103.a:0 "Finance the celebrations."
  es_req.103.b:0 "Such extravagance is unnecessary."

  es_req.104.title:0 "Monument Restoration"
  es_req.104.desc:0 "We have received a request from the §HCult of the Eternal Sunshine§!:\n"Several sites of cultural and symbolic importance require restoration. The Cult urges the Empire to preserve these monuments as enduring reminders of our shared ascent.""
  es_req.104.a:0 "Authorize restoration works."
  es_req.104.b:0 "These monuments can wait."

  es_req.105.title:0 "Sacred Reserve"
  es_req.105.desc:0 "We have received a request from the §HCult of the Eternal Sunshine§!:\n"The Cult advises the establishment of strategic reserves to ensure stability in times of uncertainty. Preparation is the highest expression of foresight.""
  es_req.105.a:0 "Contribute resources."
  es_req.105.b:0 "We need those resources elsewhere."

 es_req.106.title:0 "Show of strenght"
 es_req.106.desc:0"We have received a request from the §HCult of the Eternal Sunshine§!:/n"We must be sure that no external entity shall event try to interfere with our glorious revolution. The fleet must be reinforced to stand any enemy"."
 es_req.106.a:0 "Reinforce the ship"
 es_req.106.b:0 "They're just acting paranoiac"

 es_req.107.title:0 "Lack of energy"
 es_req.107.desc:0 "We have received a request from the §HCult of the Eternal Sunshine§!:/n"We are planning a big ceremony to recall the anniversary of our glorious revolution. The featured installation require much energy, but no price is unworthy for our noble group.""
 es_req.107.a:0 "Diverge the electricity to sustain them."
 es_req.107.b:0 "We can't waste energy."

 es_req.108.title:0 "Research Symposium"
 es_req.108.desc:0 "We have received a request from the §HCult of the Eternal Sunshine§!:/n"Knowledge is the foundation upon which every prosperous civilization is built. The Cult therefore requests the organization of a grand symposium where scholars, engineers, and visionaries may exchange ideas free from the distractions of daily administration. The enlightenment gained today shall illuminate the path of tomorrow.""
 es_req.108.a:0 "Fund the symposium."
 es_req.108.b:0 "Research can proceed without festivities."

 es_req.109.title:0 "Astronomical Survey"
 es_req.109.desc:0 "We have received a request from the §HCult of the Eternal Sunshine§!:/n"The heavens remain vast and largely unexplored. Countless opportunities, dangers, and revelations await among the stars. The Cult urges the Empire to sponsor a dedicated astronomical survey so that our gaze may reach farther than ever before.""
 es_req.109.a:0 "Finance observatories."
 es_req.109.b:0 "We have enough data."

 es_req.110.title:0 "Biological Census"
 es_req.110.desc:0 "We have received a request from the §HCult of the Eternal Sunshine§!:/n"A wise government must understand the people it guides. The Cult proposes a comprehensive census of biological and demographic data across the Empire. Through deeper understanding of our citizens, we may better secure their prosperity and health.""
 es_req.110.a:0 "Support population studies."
 es_req.110.b:0 "Unnecessary bureaucracy."

 es_req.111.title:0 "Industrial Innovation"
 es_req.111.desc:0 "We have received a request from the §HCult of the Eternal Sunshine§!:/n"Progress cannot be sustained through tradition alone. The Cult recommends a temporary redirection of resources toward industrial experimentation and modernization. New production methods developed today shall strengthen the Empire for decades to come.""
 es_req.111.a:0 "Subsidize engineers."
 es_req.111.b:0 "Industry can manage itself."

 es_req.112.title:0 "Fleet Pilgrimage"
 es_req.112.desc:0 "We have received a request from the §HCult of the Eternal Sunshine§!:/n"The guardians of our civilization must never forget the ideals they defend. The Cult proposes a ceremonial pilgrimage for selected fleet crews, allowing them to visit sites of historical significance and renew their dedication to the Empire's sacred mission.""
 es_req.112.a:0 "Organize fleet ceremonies."
 es_req.112.b:0 "Waste of military resources."

 es_req.113.title:0 "Festival of Unity"
 es_req.113.desc:0 "We have received a request from the §HCult of the Eternal Sunshine§!:/n"The strength of a civilization lies not merely in its fleets or industries, but in the shared spirit of its people. The Cult calls for a grand festival spanning every world under our banner, celebrating our common destiny and reaffirming the bonds that unite us.""
 es_req.113.a:0 "Sponsor empire-wide celebrations."
 es_req.113.b:0 "Citizens can celebrate alone."

 es_req.114.title:0 "Civic Education Program"
 es_req.114.desc:0 "We have received a request from the §HCult of the Eternal Sunshine§!:/n"The future belongs to informed citizens. The Cult proposes the expansion of educational initiatives designed to spread civic awareness, historical understanding, and devotion to the principles that have guided our rise to greatness.""
 es_req.114.a:0 "Expand ideological education."
 es_req.114.b:0 "Propaganda is unnecessary."

 es_req.115.title:0 "Recruitment Campaign"
 es_req.115.desc:0 "We have received a request from the §HCult of the Eternal Sunshine§!:/n"The Empire's future depends upon those willing to serve it. The Cult recommends a galaxy-wide recruitment campaign to inspire a new generation of administrators, officers, researchers, and public servants.""
 es_req.115.a:0 "Promote public service."
 es_req.115.b:0 "We need workers, not burocrats."

 es_req.116.title:0 "Administrative Reform"
 es_req.116.desc:0 "We have received a request from the §HCult of the Eternal Sunshine§!:/n"As our domains expand, so too must the institutions that govern them. The Cult advises a thorough review of administrative procedures, eliminating inefficiencies and ensuring that every resource reaches its intended destination.""
 es_req.116.a:0 "Expand bureaucracy."
 es_req.116.b:0 "We won't lower our people living standards for this."

 es_req.117.title:0 "Colonization Initiative"
 es_req.117.desc:0 "We have received a request from the §HCult of the Eternal Sunshine§!:/n"The stars were not placed before us to remain untouched. The Cult urges the Empire to renew its commitment to expansion and settlement. New worlds offer not only resources, but opportunities for future generations to flourish.""
 es_req.117.a:0 "Encourage frontier settlement."
 es_req.117.b:0 "Too expensive."

 es_req.118.title:0 "Hall of Heroes"
 es_req.118.desc:0 "We have received a request from the §HCult of the Eternal Sunshine§!:/n"Too often the sacrifices of great individuals fade into obscurity. The Cult requests the construction of a Hall of Heroes where the achievements of explorers, scientists, soldiers, and visionaries may be preserved for eternity.""
 es_req.118.a:0 "Shall we never forget them."
 es_req.118.b:0 "Refuse."

 es_req.119.title:0 "Trade Fair"
 es_req.119.desc:0 "We have received a request from the §HCult of the Eternal Sunshine§!:/n"Prosperity grows when ideas and goods flow freely between communities. The Cult proposes an imperial trade fair bringing together merchants, artisans, and entrepreneurs from across the Empire to strengthen economic ties and stimulate commerce.""
 es_req.119.a:0 "Fund interstellar commerce."
 es_req.119.b:0 "Commerce is secondary."

 es_req.120.title:0 "Planetary Beautification"
 es_req.120.desc:0 "We have received a request from the §HCult of the Eternal Sunshine§!:/n"The worlds we inhabit should reflect the greatness of our civilization. The Cult requests funding for public works, gardens, monuments, and urban improvements that shall inspire pride among citizens and visitors alike.""
 es_req.120.a:0 "Improve public spaces."
 es_req.120.b:0 "Cosmetic spending is wasteful."

 es_req.121.title:0 "Strategic Defensive Investment"
 es_req.121.desc:0 "We have received a request from the §HCult of the Eternal Sunshine§!:/n"A prosperous Empire must never be caught unprepared. The Cult advises the expansion of strategic stockpiles to ensure stability during future crises. Prudence today shall safeguard abundance tomorrow.""
 es_req.121.a:0 "Expand stockpiles."
 es_req.121.b:0 "Unnecessary expense."

  ########################################
  # EVENT CHAIN
  ########################################

  heretics_of_casar_soc_chain_title:0 "Heretics of Casar Soc"
  heretics_of_casar_soc_chain_desc:0 "A mysterious solar system seems to be hiding a powerful force that is menacing the order od our empire. The §HCult of the Eternal Sunshine will not stay still.§!"

  es_her.0.title: "The Gesture"
  es_her.0.desc: "A worker aboard an orbital mining facility around [Root.Capital.GetName] suffered a strange involuntary neurological episode. Witnesses describe her abruptly ceasing all activity before turning toward the night sky and raising one arm. She remained in that position for nearly six minutes.\nWhen questioned, she repeatedly uttered a phrase that has so far resisted interpretation: "§YCasar Soc§!".\nWithin days, similar incidents were reported throughout the empire.The §HCult of the Eternal Sunshine§! has reacted with concern. Their archivists have reportedly reviewed every preserved revelation, commentary, and sacred text in their possession. No reference to Casar Soc has been found."
  es_her.0.a: "Trace their gaze."
  es_her.0.b: "Silence those heretics."

  es_her.1.title:0 "Heretics of Casar Soc: A Direction Shared"
  es_her.1.desc:0 "The investigation has produced results: after comparing thousands of independent reports, astronomers have confirmed that every afflicted individual was gesturing toward the same coordinates, with a margin of error under the 0.01%.\nThe affected civilians appear to have no connections with one another before the event, and no trace of comunications have been found in any registry.\nAdditional analysis of the coordinates has revealed a §Ystrange binary system with two black holes§!. \nNo survey records mention its existence, no historical observations contain any evidence that it was ever there. Nevertheless, every sensor now agrees that it is. The §HCult§! pretends to send an exploration squad in order to restore stability among the scared civilians"
  es_her.1.a:0 "Prepare an expedition."

  es_her.2.title:0 "Heretics of Casar Soc: Turash"
  es_her.2.desc:0 "The Mask recovered from beneath the Black Stele has disappeared.\n\nAccording to the security logs, the vault containing the artifact was never opened, no alarms were triggered, and no unauthorized personnel entered the facility. Nevertheless, the Mask is gone.\n\nOnly hours later, every public display across the empire simultaneously interrupted its broadcast. A masked figure appeared on every screen, identifying himself only as §YTurash§!.\nSpeaking with unsettling calm, he claimed that Casar Soc had not been destroyed, but saved. The Black Stele, he insisted, was never a warning—it was a gift. Declaring the Eternal Sunshine blind to the truth, he announced the birth of a new movement: the Witnesses of Salvation, dedicated to offering the same salvation to the entire galaxy.\n\nThe transmission ended without revealing its origin. Despite every effort, our intelligence services have found no trace of Turash or the stolen Mask."
  es_her.2.a:0 "Find Turash before this spreads any further."

  es_her.3.title:0 "Heretics of Casar Soc: Rise of the Witnesses"
  es_her.3.desc:0 "The §HWitnesses of Salvation§! have spread with alarming speed.\nNew followers are appearing across the empire despite the absence of any formal organization. They claim to share the same recurring dream: a silent city beneath two black stars, where a masked figure waits beside a great stone monument.\n\nAt the same time, reports of the strange neurological episodes continue to rise. More troubling still, members of the Eternal Sunshine have begun disappearing. Those recovered are invariably found dead beneath crude yellow symbols resembling the markings carved into the Stele on Casar Soc.\n\nThe §HHigh Luminaries of the Cult§! insist that the Witnesses are no ordinary heretics and demand emergency powers to suppress the movement before the unrest grows into open rebellion."
  es_her.3.a:0 "Grant the Cult emergency authority."
  es_her.3.b:0 "Civil authorities will handle this."

  es_her.4.title:0 "Heretics of Casar Soc: War of the Shadows"
  es_her.4.desc:0 "Violence between the §HEternal Sunshine§! and the §HWitnesses!§ has spread across several worlds. Local authorities are struggling to contain the unrest as both factions carry out assassinations, kidnappings, and acts of sabotage against one another.\n\n§YTurash§! has resurfaced through another empire-wide transmission. He claims the Witnesses have learned the true purpose of the Black Stele and are constructing another in its image. Captured followers insist they were never given plans for the monument. Each simply "remembered" the part they were meant to build, yet every recovered fragment fits together perfectly.\n\nThe §YHigh Luminaries§! urge us to destroy the structure before it is completed. Turash claims it will reveal the truth that the Eternal Sunshine has hidden for generations."
  es_her.4.a:0 "Destroy every construction site we can find."
  es_her.4.b:0 "Observe the construction before intervening."
  es_her.4.c:0 "Allow the Cult to deal with this."

  es_her.5.title:0 "Heretics of Casar Soc: The Sign"
  es_her.5.desc:0 "The new §YStele§! is complete.\n\nThough smaller than the monument discovered on Casar Soc, it bears the same yellow symbol carved into its surface. Turash has announced his intention to reveal the Sign to the entire empire, claiming that it does not spread madness, but remembrance.\n\nThe Eternal Sunshine vehemently disagrees. According to the High Luminaries, exposing the Sign would unleash a memetic hazard capable of shattering the foundations of our civilization.\n\nBoth factions have gathered around the monument, and open battle has already begun. Before long, one side will seize control of the Stele.\nThe future of both movements now rests with us."
  es_her.5.a:0 "Stand with the Witnesses of Salvation."
  es_her.5.b:0 "Stand with the Eternal Sunshine."

  es_her.6.title:0 "Heretics of Casar Soc: Salvation"
  es_her.6.desc:0 "The §HWitnesses§! prevailed. As the last defenders of the §HEternal Sunshine§! fell, §YTurash§! approached the completed Stele wearing the stolen §YMask§!. Witnesses report that he simply placed a hand upon the monument before a low resonance spread across the battlefield.\n\nEvery member of the Witnesses turned toward the Stele. Then, without light, sound, or any detectable energy release, they vanished.\nThe Stele disappeared with them.\nWhether Turash fulfilled his promise of salvation or led his followers to oblivion remains impossible to determine. Only the §YMask§! was found, resting upon the bare ground where the monument had stood.\n\nWithout the Cult, people are now free to form new §Yfactions§!."
  es_her.6.a:0 "At last, they've been saved"

  es_her.7.title:0 "May the Sun Shine Forever"
  es_her.7.desc:0 "Imperial forces, supported by the §HEternal Sunshine§!, seized the Stele before Turash could complete his work. The surviving §HWitnesses§! were captured, and their leader was executed shortly after refusing to renounce his beliefs.\n\nThe unfinished monument has been dismantled, and reports of the strange dreams have already begun to decline. With the Witnesses destroyed, the §HEternal Sunshine§! has declared the heresy ended.\n\nThe stolen §YMask§! was recovered among Turash's possessions, the High Luminaries have ordered its destruction. Peace has prevailed, and the order is restored."
  es_her.7.a:0 "May the Sun shine forever."

  ########################################
  # DIG SITE
  ########################################

  es_casar_soc_digsite:0 "Dry lake ruins"
  es_casar_soc_digsite_desc:0 "Casar Soc would look like a normal barren world, but a scan below the surface revealed several buried building of unknown origin. A psycotic subject was brought along the expedition to find the source of the signal, and he seems to be pointing at some city ruins buried in the dirt near the bed of an ancient dried lake."

  eternal_sunshine_arc_sites_events.0.name:0 "Beneath the Dust"
  eternal_sunshine_arc_sites_events.0.desc:0 "Initial scans of Casar Soc suggested the presence of unusual subsurface formations, excavation efforts have now revealed the cause: an entire §Ycity§! is buried below the sand.\nThe structures uncovered so far resemble urban architecture. Streets, towers, enclosed chambers, and open plazas have all been identified beneath the planetary crust. Strangely enough, these buildings look like they have not been built, but they seem to be emerging from the rock itself.\nSeveral researchers have noted that the structures become increasingly difficult to distinguish from deliberate architecture as excavations progress. One report concludes that the distinction may ultimately be meaningless."

  eternal_sunshine_arc_sites_events.1.name:0 "Black Stars"
  eternal_sunshine_arc_sites_events.1.desc:0 "Further excavations have uncovered extensive carvings throughout the buried structures. Most depict astronomical scenes.\nAt first glance they appear unremarkable, upon closer inspection, however, researchers noticed a recurring anomaly: §Ythe stars are wrong§!.\n\nRather than luminous bodies, the carvings depict dark circles suspended within bright skies. Black figures gather beneath them in immense numbers, with one of them always depicted with a strange §Yyellow symbol§! on its head."

  eternal_sunshine_arc_sites_events.2.name:0 "The Stele"
  eternal_sunshine_arc_sites_events.2.desc:0 "The excavation has uncovered a monolithic structure near the center of the buried complex. The object consists of a black material not currently identifiable through conventional analysis. Preliminary measurements suggest a height of approximately thirty meters, although repeated surveys have produced inconsistent results./n/nThe surface is covered in yellow markings resembling written language, but researchers have encountered unexpected difficulties while attempting transcription since Every recorded copy §Ydiffers from every other copy§!, including machine-generated reproductions."

  eternal_sunshine_arc_sites_events.3.name:0 "The Translation"
  eternal_sunshine_arc_sites_events.3.desc:0 "While tempting to translate the language on the Stele, one of the researchers started showing the same symptoms of the previous subject, with one major difference: after the spasms ended, she was able to read the writing perfectly and provided a translation:\n\n"The Light was a wound."\n"The wound was closed."\n\n"We remained."\n"We waited."\n"We are waiting."

  eternal_sunshine_arc_sites_events.4.name:0 "The Yellow Face"
  eternal_sunshine_arc_sites_events.4.desc:0 "The chamber beneath the Stele contains only a single object. §YA mask§!.\nThough it resembles polished gold, no known material matches its composition. More curious still, no two members of the expedition agree on its appearance. Some claim it bears the face of a ruler. Others that of a loved one. A few insist they are looking at themselves.\nPhotographic records offer little help. Each image appears perfectly ordinary, yet every observer describes it differently.\n\nThe archaeological team recommended that the artifact be transferred to a secure research facility for further study. Before those recommendations could be acted upon, the Cult of the Eternal Sunshine invoked its authority over matters of suspected heresy and ordered the mask seized."

  ########################################
  # SPECIAL PROJECTS
  ########################################

  COLLECTIVE_HYSTERIA_PROJECT:0 "Collective Hysteria"
  COLLECTIVE_HYSTERIA_PROJECT_DESC:0 "Several people are manifesting psycotic symtoms, as they suddenly began shaking and pointing their fingers towards the sky while mumbling the words "§YCasar Soc§!" over and over again. There seem to be no connection between these individuals, nor geographically not demographically. We must understand what happened to these persons."
  ########################################
  # SOLAY SYSTEM
  ########################################

  Ila:0 "Ila"
  Rahal:0 "Rahal"
  casar_soc_1:0 "Mysterious force"
  casar_soc_1_desc:0 "All of the people who showed signs of psycosis seem to have been gazing towards this system"

  ########################################
  # RELICS
  ########################################

  es_yellow_mask:0 "Yellow Mask"
  es_yellow_mask_desc:0 "A mysterious artifact found on Casar Soc. Any person looking at it will describe a different face"